<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Jonagold · Supplier Early Warning</title>
<style>
  :root { --ink: #1f2a24; --muted: #5b6b62; --accent: #2f6b4f; --bg: #f6f4ee; --card: #ffffff; --line: #ddd8cc; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { max-width: 1100px; margin: 0 auto; padding: 32px 20px 8px; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { font-size: 32px; line-height: 1.15; margin: 8px 0 8px; }
  header p { font-size: 16px; line-height: 1.5; color: var(--muted); margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 56px; display: grid; gap: 20px; grid-template-columns: repeat(2, 1fr); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; min-height: 120px; }
  .box:empty::before { content: attr(data-label) " (coming soon)"; color: var(--muted); font-size: 14px; }
  #risk, #alerts { grid-column: 1 / -1; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Laurel Ridge Bikeworks · Team Jonagold</div>
  <h1>Supplier early-warning dashboard</h1>
  <p>Spotting supply chain trouble at our 13 suppliers before it stops the production line.</p>
</header>
<main>
  <div id="risk" class="box" data-label="Supplier risk overview"></div>
  <div id="weather" class="box" data-label="Weather and disaster warnings"></div>
  <div id="news" class="box" data-label="Supplier news warnings"></div>
  <div id="ports" class="box" data-label="Port and shipping warnings"></div>
  <div id="alerts" class="box" data-label="Alerts"></div>
</main>

<script src="data/laurel-ridge-data.js"></script>
<script src="sections/risk.js"></script>
<script src="sections/weather.js"></script>
<script src="sections/news.js"></script>
<script src="sections/ports.js"></script>
<script src="sections/alerts.js"></script>
</body>
</html>
